<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>部室への行き方 | D'104 Navi</title>
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body>

  <!-- Topbar -->
  <header class="topbar" id="top">
    <div class="brand">
      <div class="brandIcon" aria-hidden="true">📘</div>
      <div class="brandText">
        <div class="brandTitle">D'104 Navi</div>
        <div class="brandSub">サークルメンバーお助けツール</div>
      </div>
    </div>

    <nav class="topNav" aria-label="ページ内ナビゲーション">
      <a href="index.html" class="navLink">Home</a>
    </nav>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="heroInner">
      <p class="heroEyebrow">How to Go</p>
      <h1 class="heroTitle">部室への行き方</h1>
      <p class="heroLead">動画でルートを確認できます</p>
    </div>
  </section>

  <main class="container">

    <!-- Video Section -->
    <section class="card">
      <div class="cardHead">
        <h2 class="cardTitle">
          <span class="badge" aria-hidden="true">🎥</span>
          route movie
        </h2>
        <span class="pill">Guide</span>
      </div>

      <div class="videoWrap">
        <video controls playsinline>
          <source src="room-guide.mp4" type="video/mp4">
          お使いのブラウザでは動画を再生できません。
        </video>
      </div>

      <p class="hint">※動画が再生されない場合は、ファイル名やアップロード状況を確認してください。</p>

      <div class="actions">
        <a href="index.html" class="btnGhost">← トップへ戻る</a>
      </div>
    </section>

    

  </main>

  <footer class="footer">
    <a class="toTop" href="#top">↑ TOPへ</a>
    <small>© Circle Hub</small>
  </footer>

</body>

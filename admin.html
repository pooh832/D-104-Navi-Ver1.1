<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>幹部ページ | D'104 Navi</title>
  <link rel="stylesheet" href="styles.css?v=21" />
</head>
<body>
  <header class="topbar" id="top">
    <div class="brand">
      <div class="brandIcon">📘</div>
      <div class="brandText">
        <div class="brandTitle">Club D'104</div>
        <div class="brandSub">管理ページ</div>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="heroInner">
      <p class="heroEyebrow">Admin Page</p>
      <h1 class="heroTitle">幹部ページ</h1>
      <p class="heroLead">ログイン済みの幹部のみ表示されます。</p>
    </div>
  </section>

  <main class="container">

    <section class="card">
      <div class="cardHead">
        <h2 class="cardTitle"><span class="badge">👤</span> admin user</h2>
      </div>
      <p>ログイン中: <strong id="userEmail">確認中...</strong></p>

      <div class="actions">
        <button class="btnGhost" onclick="logoutUser()">ログアウト</button>
      </div>
    </section>

    <section class="card">
      <div class="cardHead">
        <h2 class="cardTitle"><span class="badge">📝</span> event editor</h2>
      </div>

      <div class="nextBox" style="gap:14px;">
        <div>
          <label class="k" for="eventTitle">予定タイトル</label>
          <input id="eventTitle" type="text" placeholder="例：新歓ミーティング"
            style="width:100%;margin-top:8px;padding:12px 14px;border-radius:14px;border:1px solid rgba(0,0,0,.12);font-size:14px;">
        </div>

        <div>
          <label class="k" for="eventLocation">場所</label>
          <input id="eventLocation" type="text" placeholder="例：BOX集合 or Zoom"
            style="width:100%;margin-top:8px;padding:12px 14px;border-radius:14px;border:1px solid rgba(0,0,0,.12);font-size:14px;">
        </div>

        <div>
          <label class="k" for="eventStart">開始日時</label>
          <input id="eventStart" type="datetime-local"
            style="width:100%;margin-top:8px;padding:12px 14px;border-radius:14px;border:1px solid rgba(0,0,0,.12);font-size:14px;">
        </div>

        <div>
          <label class="k" for="eventEnd">終了日時</label>
          <input id="eventEnd" type="datetime-local"
            style="width:100%;margin-top:8px;padding:12px 14px;border-radius:14px;border:1px solid rgba(0,0,0,.12);font-size:14px;">
        </div>
      </div>

      <div class="actions">
        <button class="btnPrimary" id="saveEventBtn" type="button">予定を追加</button>
      </div>

      <p id="adminMessage" class="hint"></p>
    </section>

    <section class="card">
      <div class="cardHead">
        <h2 class="cardTitle"><span class="badge">📚</span> saved events</h2>
      </div>

      <div id="adminEventList">
        <p class="hint">読み込み中...</p>
      </div>
    </section>

    <section class="card">
  <div class="cardHead">
    <h2 class="cardTitle"><span class="badge">❓</span> questions</h2>
  </div>

  <div id="adminQuestionList">
    <p class="hint">質問を読み込み中...</p>
  </div>
</section>

  </main>

  <script type="module">
  import "./auth.js";
  import { addEvent, listenEvents } from "./events-db.js";
  import { listenQuestions, answerQuestion } from "./questions-db.js";



    window.protectAdminPage();

    const saveEventBtn = document.getElementById("saveEventBtn");
    const adminMessage = document.getElementById("adminMessage");
    const adminEventList = document.getElementById("adminEventList");

    function formatDateJP(dateString) {
      const date = new Date(dateString);
      const week = ["日", "月", "火", "水", "木", "金", "土"];
      const month = date.getMonth() + 1;
      const day = date.getDate();
      const weekday = week[date.getDay()];
      const hour = String(date.getHours()).padStart(2, "0");
      const minute = String(date.getMinutes()).padStart(2, "0");
      return `${month}/${day} (${weekday}) ${hour}:${minute}`;
    }

    function renderAdminEvents(events) {
      if (!events || !events.length) {
        adminEventList.innerHTML = `<p class="hint">まだ予定はありません。</p>`;
        return;
      }

          function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function formatQuestionDate(dateString) {
      const date = new Date(dateString);
      const yyyy = date.getFullYear();
      const mm = String(date.getMonth() + 1).padStart(2, "0");
      const dd = String(date.getDate()).padStart(2, "0");
      const hh = String(date.getHours()).padStart(2, "0");
      const min = String(date.getMinutes()).padStart(2, "0");
      return `${yyyy}/${mm}/${dd} ${hh}:${min}`;
    }

    function renderQuestions(questions) {
      const adminQuestionList = document.getElementById("adminQuestionList");

      if (!questions || !questions.length) {
        adminQuestionList.innerHTML = `<p class="hint">まだ質問はありません。</p>`;
        return;
      }

      questions.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

      adminQuestionList.innerHTML = questions.map(q => `
        <div class="card" style="margin-bottom:16px;">
          <div class="cardHead">
            <h3 class="cardTitle">
              <span class="badge">?</span>
              ${escapeHtml(q.category || "未分類")}
            </h3>
          </div>

          <p class="hint">送信者：${escapeHtml(q.name || "匿名")} / ${formatQuestionDate(q.createdAt)}</p>
          <p style="margin-top:10px; font-weight:700;">${escapeHtml(q.text || "")}</p>

          <div style="margin-top:14px;">
            <label class="k" for="answer-${q.id}">回答</label>
            <textarea
              id="answer-${q.id}"
              rows="4"
              style="width:100%;margin-top:8px;padding:12px 14px;border-radius:14px;border:1px solid rgba(0,0,0,.12);font-size:14px;resize:vertical;"
              placeholder="回答を入力してください"
            >${escapeHtml(q.answer || "")}</textarea>
          </div>

          <div class="actions" style="margin-top:12px;">
            <button class="btnPrimary answer-btn" data-id="${q.id}" type="button">回答を保存</button>
          </div>

          ${
            q.answer
              ? `<p class="hint">公開中の回答あり</p>`
              : `<p class="hint">未回答</p>`
          }
        </div>
      `).join("");

      document.querySelectorAll(".answer-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.id;
          const textarea = document.getElementById(`answer-${id}`);
          const answer = textarea.value.trim();

          if (!answer) {
            alert("回答を入力してください。");
            return;
          }

          answerQuestion(id, answer);
          alert("回答を保存しました。");
        });
      });
    }

      events.sort((a, b) => new Date(a.start) - new Date(b.start));

      adminEventList.innerHTML = events.map(event => `
        <div class="newsItem">
          <span class="date">${formatDateJP(event.start)}</span>
          <span class="dot" aria-hidden="true"></span>
          <span class="text">${event.title} / ${event.location}</span>
        </div>
      `).join("");
    }

    saveEventBtn.addEventListener("click", () => {
      const title = document.getElementById("eventTitle").value.trim();
      const location = document.getElementById("eventLocation").value.trim();
      const start = document.getElementById("eventStart").value;
      const end = document.getElementById("eventEnd").value;

      if (!title || !location || !start || !end) {
        adminMessage.textContent = "すべて入力してください。";
        return;
      }

      if (new Date(end) <= new Date(start)) {
        adminMessage.textContent = "終了日時は開始日時より後にしてください。";
        return;
      }

      addEvent({
        title,
        location,
        start,
        end
      });

      adminMessage.textContent = "予定を保存しました。";

      <section class="card" style="margin-top:20px;">
  <div class="cardHead">
    <h2 class="cardTitle"><span class="badge">📚</span> saved events</h2>
  </div>

  <div id="savedEventsList">
    <p class="hint">予定を読み込み中...</p>
  </div>
</section>

      document.getElementById("eventTitle").value = "";
      document.getElementById("eventLocation").value = "";
      document.getElementById("eventStart").value = "";
      document.getElementById("eventEnd").value = "";
    });

    listenEvents((events) => {
      renderAdminEvents(events);
    });

    listenQuestions((questions) => {
      renderQuestions(questions);
    });
  </script>

  <script type="module">
  import { db } from "./firebase-config.js";
  import { ref, get, set } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";

  const disneyRef = ref(db, "disneyEvents");

  get(disneyRef).then((snapshot) => {
    if (!snapshot.exists()) {
      return set(disneyRef, {
        event1: {
          title: "東京ディズニーシー 25周年開始",
          date: "2026-04-08",
          type: "resort",
          link: "https://www.tokyodisneyresort.jp/",
          note: "イベント開始日"
        },
        event2: {
          title: "ミッキー スクリーンデビュー日",
          date: "2026-11-18",
          type: "character",
          link: "https://www.disney.co.jp/",
          note: "スクリーンデビュー記念日"
        }
      });
    }
  }).then(() => {
    console.log("disneyEvents ready");
  }).catch((error) => {
    console.error("disneyEvents error:", error);
  });
</script>
</body>
</html>

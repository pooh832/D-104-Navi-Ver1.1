<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>幹部ページ | D'104 Navi</title>

  <link rel="stylesheet" href="./styles.css?v=25" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap"
  rel="stylesheet">
</head>

<body>

  <!-- Topbar -->
  <header class="topbar" id="top">
    <div class="brand">
      <div class="brandIcon">📘</div>

      <div class="brandText">
        <div class="brandTitle">Club D'104</div>
        <div class="brandSub">Management Portal</div>
      </div>
    </div>

    <nav class="topNav">
      <a href="index.html" class="navLink">Home</a>
    </nav>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="heroInner">
      <p class="heroEyebrow">ADMIN ONLY</p>

      <h1 class="heroTitle">
        Management Center
      </h1>

      <p class="heroLead">
        D'104運営用ページ
      </p>
    </div>
  </section>

  <main class="container">

    <!-- User Card -->
    <section class="card">
      <div class="cardHead">
        <h2 class="cardTitle">
          <span class="badge">👤</span>
          admin user
        </h2>
      </div>

      <p>
        ログイン中：
        <strong id="userEmail">確認中...</strong>
      </p>

      <div class="actions">
        <button class="btnGhost" onclick="logoutUser()">
          ログアウト
        </button>
      </div>
    </section>

    <!-- Management -->
    <div class="sectionTitle">
      MANAGEMENT
    </div>

    <section class="grid">

      <!-- Events -->
      <a class="tile" href="admin-events.html">
        <span class="emoji">📚</span>

        <div class="tileText">
          <h3>Saved Events</h3>
          <p>活動予定の追加・編集・削除</p>
        </div>

        <span class="arrow">›</span>
      </a>

      <!-- Disney -->
      <a class="tile" href="admin-disney-events.html">
        <span class="emoji">🏰</span>

        <div class="tileText">
          <h3>Saved Disney Events</h3>
          <p>Disneyイベントの管理</p>
        </div>

        <span class="arrow">›</span>
      </a>

      <!-- Trivia -->
      <a class="tile" href="admin-trivia.html">
        <span class="emoji">✨</span>

        <div class="tileText">
          <h3>Saved Trivia</h3>
          <p>トリビアの追加・編集・削除</p>
        </div>

        <span class="arrow">›</span>
      </a>

      <!-- Questions -->
      <a class="tile" href="admin-questions.html">
        <span class="emoji">❓</span>

        <div class="tileText">
          <h3>Questions</h3>
          <p>質問への回答管理</p>
        </div>

        <span class="arrow">›</span>
      </a>

    </section>

  </main>

  <footer class="footer">
    <a href="#top" class="toTop">
      ↑ TOPへ
    </a>

    <small>
      © Club D'104
    </small>
  </footer>

  <!-- Auth -->
  <script type="module">
    import "./auth.js";

    window.protectAdminPage();

    const emailEl = document.getElementById("userEmail");

    if (window.auth) {
      window.auth.onAuthStateChanged(user => {
        if (emailEl) {
          emailEl.textContent =
            user?.email || "未ログイン";
        }
      });
    }
  </script>

</body>
</html>
